[versions]
agp                      = "8.5.2"
kotlin                   = "2.0.0"
ksp                      = "2.0.0-1.0.21"
compose-bom              = "2024.06.00"
hilt                     = "2.51.1"
hilt-navigation-compose  = "1.2.0"
room                     = "2.6.1"
navigation-compose       = "2.7.7"
lifecycle                = "2.8.3"
coroutines               = "1.8.1"
datastore                = "1.1.1"
splash                   = "1.0.1"
core-ktx                 = "1.13.1"
activity-compose         = "1.9.0"
material3                = "1.2.1"
junit                    = "4.13.2"
androidx-junit           = "1.2.1"
espresso                 = "3.6.1"
workmanager              = "2.9.1"
hilt-workmanager         = "1.2.0"
biometric                = "1.1.0"
security-crypto          = "1.1.0-alpha06"
paging                   = "3.3.2"

[libraries]
androidx-core-ktx               = { group = "androidx.core",     name = "core-ktx",               version.ref = "core-ktx" }
androidx-activity-compose       = { group = "androidx.activity", name = "activity-compose",        version.ref = "activity-compose" }
androidx-splash                 = { group = "androidx.core",     name = "core-splashscreen",       version.ref = "splash" }
compose-bom                     = { group = "androidx.compose",  name = "compose-bom",             version.ref = "compose-bom" }
compose-ui                      = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-test-manifest        = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
compose-ui-test-junit4          = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
compose-material3               = { group = "androidx.compose.material3", name = "material3",      version.ref = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material",  name = "material-icons-extended" }
navigation-compose              = { group = "androidx.navigation", name = "navigation-compose",    version.ref = "navigation-compose" }
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx           = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }
hilt-android                    = { group = "com.google.dagger", name = "hilt-android",            version.ref = "hilt" }
hilt-android-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler",   version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
room-runtime                    = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx                        = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler                   = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
coroutines-android              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test                 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }
datastore-preferences           = { group = "androidx.datastore", name = "datastore-preferences",  version.ref = "datastore" }
junit                           = { group = "junit",               name = "junit",          version.ref = "junit" }
androidx-junit                  = { group = "androidx.test.ext",   name = "junit",          version.ref = "androidx-junit" }
androidx-espresso               = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
workmanager-ktx                 = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
hilt-workmanager                = { group = "androidx.hilt",  name = "hilt-work",         version.ref = "hilt-workmanager" }
hilt-workmanager-compiler       = { group = "androidx.hilt",  name = "hilt-compiler",     version.ref = "hilt-workmanager" }
biometric                       = { group = "androidx.biometric", name = "biometric",          version.ref = "biometric" }
security-crypto                 = { group = "androidx.security",  name = "security-crypto",    version.ref = "security-crypto" }
paging-runtime                  = { group = "androidx.paging",   name = "paging-runtime",     version.ref = "paging" }
paging-compose                  = { group = "androidx.paging",   name = "paging-compose",     version.ref = "paging" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
